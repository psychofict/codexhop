<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="460" viewBox="0 0 1340 460" role="img"
     aria-label="codexhop: switch OpenAI Codex between your ChatGPT accounts">
  <title>codexhop</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#cfcfdb" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- White canvas with a hairline grid that fades out behind the words. -->
  <rect width="1340" height="460" fill="#ffffff"/>
  <rect width="1340" height="460" fill="url(#grid)" opacity="0.6"/>
  <rect width="1340" height="460" fill="url(#fade)"/>

  <!-- The mark (logo.svg): a switch whose knob is the prompt; the rings are the accounts it hopped past.
       Night #150f23, deep violet #1f1633, hairline #362d59, violet #6a5fc1, lime #c2ef4e, pink #fa7faa. -->
  <g transform="translate(70 70) scale(0.625)">
    <rect width="512" height="512" rx="112" fill="#150f23"/>
    <rect x="40" y="148" width="432" height="216" rx="108" fill="#1f1633" stroke="#362d59" stroke-width="6"/>
    <circle cx="152" cy="256" r="72" fill="none" stroke="#6a5fc1" stroke-width="8" opacity="0.45"/>
    <circle cx="240" cy="256" r="72" fill="none" stroke="#fa7faa" stroke-width="8" opacity="0.8"/>
    <circle cx="362" cy="256" r="86" fill="#c2ef4e"/>
    <g fill="none" stroke="#150f23" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M322 218 L358 256 L322 294"/>
      <path d="M372 296 L406 296"/>
    </g>
  </g>

  <!-- Wordmark in night ink with a violet block cursor. -->
  <text x="458" y="232" font-family="Rubik, system-ui, sans-serif" font-size="128" font-weight="700"
        letter-spacing="-4" fill="#150f23">codexhop</text>
  <rect x="1072" y="140" width="44" height="94" rx="6" fill="#6a5fc1"/>

  <text x="462" y="300" font-family="Rubik, system-ui, sans-serif" font-size="30" font-weight="400"
        fill="#79628c">Switch OpenAI Codex between your ChatGPT accounts.</text>

  <!-- The command it takes. -->
  <rect x="462" y="338" width="246" height="58" rx="29" fill="#f0f0f0" stroke="#cfcfdb" stroke-width="2"/>
  <text x="490" y="376" font-family="'JetBrains Mono', Monaco, monospace" font-size="26" font-weight="500"
        fill="#6a5fc1">$ <tspan fill="#1f1633">chop work</tspan></text>
</svg>
